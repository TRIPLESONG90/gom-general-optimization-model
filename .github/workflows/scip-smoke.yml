name: SCIP E2E Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "gom/**"
      - "scripts/**"
      - "experiments/**"
      - "pyproject.toml"
      - ".github/workflows/scip-smoke.yml"

jobs:
  scip-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GOM + SCIP
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[scip,dev]'
          python - <<'PY'
          import pyscipopt
          print("PySCIPOpt", pyscipopt.__version__)
          PY
      - name: Run v0.3 top-1 smoke baseline
        run: |
          python scripts/run_experiment.py \
            --config experiments/scip_v03.yaml \
            --profile smoke \
            --run-dir /tmp/gom-scip-v03
          cat /tmp/gom-scip-v03/REPORT.md
      - name: Run v0.4 ranking smoke on the same trajectories
        run: |
          mkdir -p /tmp/gom-scip-v04
          cp /tmp/gom-scip-v03/trajectories-*.jsonl /tmp/gom-scip-v04/
          python scripts/run_experiment.py \
            --config experiments/scip_v04.yaml \
            --profile smoke \
            --run-dir /tmp/gom-scip-v04 \
            --skip-collect
          cat /tmp/gom-scip-v04/REPORT.md
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scip-smoke-reports
          path: |
            /tmp/gom-scip-v03/manifest.json
            /tmp/gom-scip-v03/benchmark.jsonl
            /tmp/gom-scip-v03/summary.json
            /tmp/gom-scip-v03/REPORT.md
            /tmp/gom-scip-v04/manifest.json
            /tmp/gom-scip-v04/benchmark.jsonl
            /tmp/gom-scip-v04/summary.json
            /tmp/gom-scip-v04/REPORT.md
          if-no-files-found: warn
