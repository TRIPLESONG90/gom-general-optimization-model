name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -q
      - name: Tiny forward/training smoke test
        run: python scripts/train_synthetic.py --tiny --steps 1 --batch-size 2
      - name: Experiment runner dry-run
        run: python scripts/run_experiment.py --profile smoke --dry-run --run-dir /tmp/gom-ci-dry-run
