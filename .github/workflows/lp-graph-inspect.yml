name: SCIP LP Graph Inspect

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v0.4-learning-diagnostics"
    paths:
      - "scripts/inspect_scip_lp_graph.py"
      - ".github/workflows/lp-graph-inspect.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GOM + SCIP
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[scip]'
      - name: Inspect native LP graph
        run: python scripts/inspect_scip_lp_graph.py
